services:
  whatsapp-assistant:
    image: whatsapp-assistant:${TAG:-latest}
    build: .
    container_name: whatsapp-assistant
    restart: unless-stopped
    volumes:
      - ./auth_info:/app/auth_info
      - ./deleted_media:/app/deleted_media
      - ./whitelist.json:/app/whitelist.json
      - ./ai_whitelist.json:/app/ai_whitelist.json
      - ./msg_cache.json:/app/msg_cache.json
      - ./prompts:/app/prompts:ro
    environment:
      - NODE_ENV=production
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:20128/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_IMAGE_MODEL=${AI_IMAGE_MODEL:-}
      - AI_TTS_MODEL=${AI_TTS_MODEL:-}
      - AI_STT_MODEL=${AI_STT_MODEL:-}
      - AI_VIDEO_MODEL=${AI_VIDEO_MODEL:-}
      - AI_SYSTEM_PROMPT_FILE=${AI_SYSTEM_PROMPT_FILE:-prompts/system.txt}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-60000}
      - AI_VIDEO_TIMEOUT_MS=${AI_VIDEO_TIMEOUT_MS:-600000}
      - AI_VIDEO_POLL_MS=${AI_VIDEO_POLL_MS:-5000}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1000}
      - AI_MAX_PROMPT_CHARS=${AI_MAX_PROMPT_CHARS:-4000}
      - AI_MEDIA_MAX_BYTES=${AI_MEDIA_MAX_BYTES:-20971520}
      - AI_ALLOW_GROUPS=${AI_ALLOW_GROUPS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true # allows you to see QR code and interact if needed
    tty: true
